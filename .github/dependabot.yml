version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: 'crate-ci/typos'
      - dependency-name: 'actions/dependency-review-action'
        versions:
          # https://github.com/actions/dependency-review-action/issues/759
          - '4.3.1'
          - '4.3.0'
          # https://github.com/actions/dependency-review-action/issues/493
          - '3.0.5'
    cooldown:
      default-days: 7
  # Cargo updates were migrated to Renovatebot.
  # Dependabot had critical issues with cargo:
  # - https://github.com/dependabot/dependabot-core/issues/4009: `versioning-strategy: increase` causes runtime errors.
  # - https://github.com/dependabot/dependabot-core/issues/14196: Dependabot updates Cargo.lock without updating Cargo.toml,
  #   leaving outdated version requirements in Cargo.toml and preventing lockfile updates for security vulnerabilities.

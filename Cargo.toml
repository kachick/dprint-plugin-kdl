[package]
name = "dprint-plugin-kdl"
version = "0.4.2"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-kdl"
keywords = ["formatting", "formatter", "kdl"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/dprint/dprint-plugin-kdl"
description = "KDL formatter for dprint via kdl-rs."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.71.0", default-features = false }
kdl = "6.7.1"
# Although kdl 6.x provides an optional "v1" feature, it converts the AST into v2 representation
# (e.g. autoformatting outputs #true instead of true, and strips quotes from strings).
# We intentionally depend directly on kdl 4.x to provide genuine, stable KDL v1 formatting.
# See: https://github.com/kdl-org/kdl-rs/blob/v6.7.1/Cargo.toml#L18-L28
kdl-v1 = { package = "kdl", version = "4.7.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = "1.0.154"

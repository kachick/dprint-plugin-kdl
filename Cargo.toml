[package]
name = "dprint-plugin-kdl"
version = "0.3.3"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kachick/dprint-plugin-kdl"
description = "dprint plugin for KDL formatting using kdl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dprint-core = { version = "0.69.1", features = ["wasm"] }
kdl = "6.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lib]
crate-type = ["lib", "cdylib"]
# Distributed only as a dprint WASM plugin with no public Rust API
doctest = false

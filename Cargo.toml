[package]
name = "dprint-plugin-kdl"
version = "0.4.0"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kachick/dprint-plugin-kdl"
description = "dprint plugin for KDL formatting using kdl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
schema = ["dep:schemars"]

[dependencies]
dprint-core = { version = "0.69.1", features = ["wasm"] }
kdl = "6.7.1"
# Although kdl 6.x provides an optional "v1" feature, it converts the AST into v2 representation
# (e.g. autoformatting outputs #true instead of true, and strips quotes from strings).
# We intentionally depend directly on kdl 4.x to provide genuine, stable KDL v1 formatting.
# See: https://github.com/kdl-org/kdl-rs/blob/v6.7.1/Cargo.toml#L18-L28
kdl-v1 = { package = "kdl", version = "4.7.0" }
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lib]
crate-type = ["lib", "cdylib"]
# Distributed only as a dprint WASM plugin with no public Rust API
doctest = false

[workspace]
resolver = "2"
members = ["crates/schemagen"]

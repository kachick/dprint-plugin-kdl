# https://taskfile.dev

version: '3'

env:
  # If test for nix product: `PLUGIN_PATH="$PWD/result/lib/plugin.wasm" task`
  PLUGIN_PATH: '{{.USER_WORKING_DIR}}/target/wasm32-unknown-unknown/debug/dprint_plugin_kdl.wasm'

tasks:
  default:
    deps:
      - check
      - test
  build: # Prefer cargo cache rather than go-task cache feature
    env:
      SKIP_BUILD: 'false' # Don't use "$CI" for this purpose
      CARGO_BUILD_TARGET: 'wasm32-unknown-unknown'
    status:
      - |
        [ "$SKIP_BUILD" == 'true' ]
    cmds:
      # Omit "--release" for development purpose. Release assets should use `nix build`
      - cargo build
  check:
    deps:
      - test
      - lint
  test:
    deps:
      - test-unit
      - test-e2e
  test-unit:
    env:
      SKIP_BUILD: 'false'
    status:
      - |
        [ "$SKIP_BUILD" == 'true' ]
    cmds:
      - cargo test --workspace
  test-e2e:
    deps:
      - test-e2e-v2-official
      - test-e2e-v1-zellij
      - test-e2e-mixed-versions
      - test-e2e-error-cases
  test-e2e-error-cases:
    deps:
      - build
    cmds:
      - ./scripts/e2e.bash error-cases
  test-e2e-*:
    deps:
      - build
    vars:
      TESTNAME: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/e2e.bash check '{{.TESTNAME}}'
  bump-fixtures-*:
    deps:
      - build
    vars:
      TESTNAME: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/e2e.bash bump '{{.TESTNAME}}'
  bump-fixtures:
    deps:
      - bump-fixtures-v2-official
      - bump-fixtures-v1-zellij
      - bump-fixtures-mixed-versions
  fmt:
    cmds:
      - cargo fmt
      - dprint fmt
  lint:
    cmds:
      - cargo clippy -- --deny warnings
      - cargo fmt --check
      - cargo run --package sync-pkg-json -- --check
      - dprint check
      - typos . .github .vscode
      - zizmor .
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- list -check
  sync-package-json:
    cmds:
      - cargo run --package sync-pkg-json
  bump:
    cmds:
      - cargo run --package sync-pkg-json -- {{.CLI_ARGS}}
      - cargo check --workspace
      - git add Cargo.toml npm/package.json Cargo.lock
      - git commit -m "Bump version to {{.CLI_ARGS}}"
  schema:
    cmds:
      - cargo run --package schemagen
  selfup:
    cmds:
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- run
